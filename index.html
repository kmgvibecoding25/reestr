<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Реестр претензий по пене</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri-d:#1e3a8a;--red:#dc2626;--amber:#d97706;--green:#16a34a;--rad:10px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
input:disabled,select:disabled,textarea:disabled{background:#f8fafc;color:#475569}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0}
.mut{color:var(--mut)}.small{font-size:12px}
.btn{border:1px solid #cbd5e1;background:#fff;color:var(--ink);padding:7px 14px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--red);border-color:#fecaca}.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}.btn.light:hover{background:rgba(255,255,255,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--mut);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px}.x:hover{background:#f1f5f9;color:var(--red)}
/* header */
header.top{background:linear-gradient(90deg,#0b2a5b,#1d4ed8);color:#fff;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:14px 0}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#fff;color:var(--pri);font-style:normal;font-size:15px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#c7d7fb;padding:17px 12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.user{display:flex;align-items:center;gap:10px;padding:8px 0}
.me{background:none;border:0;color:#fff;text-align:right;display:flex;flex-direction:column;line-height:1.2;padding:4px 6px;border-radius:6px}
.me:hover{background:rgba(255,255,255,.12)}.me small{color:#c7d7fb;font-size:12px}
.bell-wrap{position:relative}
.bell{background:none;border:0;color:#fff;position:relative;padding:6px;border-radius:6px;display:flex}.bell:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;border-radius:999px;font-size:11px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.badge:empty{display:none}
.dd{position:absolute;right:0;top:44px;width:min(420px,92vw);background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.25);max-height:70vh;overflow:auto;z-index:40}
.dd-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dd-i{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.dd-i:hover{background:#f8fafc}.dd-i.unread{background:#eff6ff}.dd-i small{color:var(--mut);display:block}
/* layout */
.wrap{max-width:1600px;margin:0 auto;padding:16px 20px 40px}
.card{background:var(--card);border-radius:var(--rad);box-shadow:0 1px 2px rgba(15,23,42,.06),0 0 0 1px rgba(15,23,42,.04);padding:14px 16px;margin-bottom:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.filters select{max-width:230px}
.qbtns{display:flex;gap:4px;flex-wrap:wrap}
.qbtns button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:6px 9px;font-size:13px}
.qbtns button.on{background:#dbeafe;border-color:#93c5fd;color:var(--pri-d)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--rad);padding:12px 14px;border-left:4px solid var(--c,#1d4ed8);box-shadow:0 1px 2px rgba(15,23,42,.06),0 0 0 1px rgba(15,23,42,.04)}
.kpi-t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.02em}
.kpi-v{font-size:22px;font-weight:700;margin:3px 0;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:14px;font-weight:600;color:#334155}
.kpi-s{font-size:12.5px;color:#475569}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-bottom:14px}
.charts .card{margin:0}
.chart-box{position:relative;height:290px}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#f8fafc;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;color:#334155;position:sticky;top:0;z-index:1}
.tbl th.s{cursor:pointer;user-select:none}.tbl th.s:hover{background:#eef2f7}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl td.wrap{white-space:normal;min-width:180px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#eef4ff}
.tbl tr.overdue td{background:#fef2f2}.tbl tr.lim td{background:#fffbeb}
.tbl tfoot td{background:#f8fafc;font-weight:700;border-top:2px solid var(--line)}
.tbl td input,.tbl td select{width:100%;padding:4px 6px;font-size:13px}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#f1f5f9;color:#475569;margin-left:4px}
.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;font-size:13px}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:12px;width:min(640px,100%);box-shadow:0 24px 60px rgba(15,23,42,.35);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.modal.xl{width:min(1200px,100%)}
.modal-h,.modal-f,.ctabs{flex-shrink:0}
.modal-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-h h2{margin:0}
.modal-b{padding:16px 20px;overflow:auto;flex:1}
.modal-f{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fafbfc;border-radius:0 0 12px 12px}
.ctabs,.subtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs{padding:0;margin-bottom:14px}
.ctabs button,.subtabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:#475569;white-space:nowrap}
.ctabs button.on,.subtabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.ctabs button:disabled{color:#cbd5e1;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.f i{color:var(--red);font-style:normal}
label.f small{color:var(--mut);font-size:11.5px}
.full{grid-column:1/-1}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;align-self:end;padding-bottom:6px}
label.chk input{width:16px;height:16px}
.errs{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.errs ul{margin:4px 0 0;padding-left:18px}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sumbar b{font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.box-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.total-big{font-size:20px;font-weight:700}
.sec{margin:18px 0 8px;font-size:14px;font-weight:600;color:#334155}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b2a5b,#1d4ed8);padding:16px}
.login-card{background:#fff;border-radius:14px;padding:28px;width:min(440px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:20px;margin:0 0 4px}
.note{font-size:12px;color:var(--mut);margin-top:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;max-width:90vw}
.toast.err{background:#b91c1c}
footer.foot{text-align:center;color:var(--mut);font-size:12px;padding:0 20px 24px}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps span{padding:4px 10px;border-radius:999px;background:#f1f5f9;font-size:12.5px;color:#475569}
.steps span.on{background:#dbeafe;color:var(--pri-d);font-weight:600}
@media(max-width:700px){
 header.top{padding:0 12px;gap:6px}.brand{padding:10px 0 0}
 nav.tabs{order:3;flex-basis:100%}
 .user{margin-left:auto}.me small{display:none}
 .wrap{padding:12px 16px 30px}
 .filters label{flex:1 1 140px}.filters select,.filters input{max-width:none;width:100%}
 .charts{grid-template-columns:1fr}
 .modal-back{padding:0}.modal{max-height:100vh;border-radius:0}
}
@media print{header.top,.filters,.toolbar{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* =================== Константы и справочники =================== */
const LS='pp_registry_v1', SS='pp_session_v1';
const ROLES={executor:'Исполнитель',manager:'Руководитель',admin:'Администратор',observer:'Наблюдатель'};
const PERMS={view:'Просмотр претензий, статистики, журнала',create:'Создание претензии',edit:'Редактирование претензий, оплат, суда, взыскания, файлов',reassign:'Смена исполнителя',delete:'Удаление и восстановление претензий',export:'Экспорт в Excel',import:'Импорт из Excel',admin:'Справочники, ставки, настройки уведомлений и интеграций'};
const DEFAULT_PERMS={view:{executor:1,manager:1,admin:1,observer:1},create:{executor:1,manager:1,admin:1,observer:0},edit:{executor:1,manager:1,admin:1,observer:0},reassign:{executor:0,manager:1,admin:1,observer:0},delete:{executor:0,manager:1,admin:1,observer:0},export:{executor:1,manager:1,admin:1,observer:1},import:{executor:0,manager:1,admin:1,observer:0},admin:{executor:0,manager:0,admin:1,observer:0}};
const PAY_ST={none:'Не оплачено',partial:'Частично оплачено',full:'Оплачено полностью'};
const PAY_C={none:'#dc2626',partial:'#d97706',full:'#16a34a'};
const RESULTS={pending:'На рассмотрении',satisfied_full:'Удовлетворена полностью',satisfied_partial:'Удовлетворена частично',rejected:'Не удовлетворена — отказано',withdrawn:'Не удовлетворена — иск отозван'};
const ENF_ST={await:'Ожидает передачи ЧСИ',at_bailiff:'Не взыскано — у ЧСИ',partial:'Частично взыскано — остаток у ЧСИ',full:'Взыскано полностью (оплачено)'};
const ENF_C={await:'#9333ea',at_bailiff:'#dc2626',partial:'#d97706',full:'#16a34a'};
const STATUS={pretrial:{t:'На досудебной стадии',c:'#2563eb'},paid:{t:'Оплачено добровольно',c:'#16a34a'},court:{t:'В суде',c:'#7c3aed'},sat_collected:{t:'Удовлетворена в суде — взыскано',c:'#059669'},sat_partial:{t:'Удовлетворена в суде — частично взыскано',c:'#d97706'},sat_none:{t:'Удовлетворена в суде — не взыскано (у ЧСИ)',c:'#dc2626'},rejected:{t:'Не удовлетворена в суде',c:'#64748b'}};
const STAGES={pretrial:'Досудебная',court:'Суд',enforcement:'Исполнение'};
const METHODS={pct:'Процент в день от суммы просрочки',fixed:'Фиксированная сумма в день',fine:'Разовый штраф, % от обязательства',nbrk:'По базовой ставке НБ РК'};
const DOC_TYPES=['Скан претензии','Расчёт пени','Платёжный документ','Исковое заявление','Решение суда','Исполнительный лист','Документы от ЧСИ','Прочее'];
const FILE_EXT=['pdf','doc','docx','xls','xlsx','jpg','jpeg','png'];
const ACTIONS={login:'Вход в систему',logout:'Выход из системы',create:'Создание',update:'Изменение',delete:'Удаление',restore:'Восстановление',file_add:'Загрузка файла',file_del:'Удаление файла',import:'Импорт',import_rollback:'Отмена импорта',notify:'Отправка уведомления',settings:'Справочники и настройки'};
const EVENTS={
 assigned:{t:'Назначена претензия / сменился исполнитель',to:'новому исполнителю',pl:''},
 due_soon:{t:'Срок добровольной оплаты подходит',to:'исполнителю',pl:'за N дней'},
 due_over:{t:'Срок оплаты истёк, остаток не оплачен, иск не подан',to:'исполнителю; копия начальнику отдела',pl:'в день истечения, затем каждые N дней'},
 hearing:{t:'Судебное заседание',to:'исполнителю',pl:'за N дней (через запятую)'},
 effective:{t:'Решение вступает в силу — получить исполнительный лист',to:'исполнителю',pl:'в дату вступления в силу'},
 writ_not_transferred:{t:'Исполнительный лист не передан ЧСИ',to:'исполнителю',pl:'через N дней после вступления в силу'},
 no_bailiff_payments:{t:'Нет поступлений у ЧСИ',to:'исполнителю; копия руководителям',pl:'каждые N дней, пока есть остаток'},
 limitation:{t:'Приближается срок исковой давности',to:'исполнителю и руководителям',pl:'за N дней (через запятую)'},
 stale:{t:'Претензия без движения',to:'исполнителю',pl:'N дней без изменений'},
 summary:{t:'Сводка за неделю и за месяц',to:'руководителям',pl:'понедельник и 1-е число месяца'}
};
const CHANNELS={site:'На сайте',email:'E-mail',msg:'Мессенджер'};
function defaultSettings(){return{
 dueDays:10,limitationYears:3,dayRule:'next_incl',defaultMethod:'pct',defaultRate:0.1,defaultCapPct:10,
 perms:JSON.parse(JSON.stringify(DEFAULT_PERMS)),
 events:{assigned:{on:true,p:''},due_soon:{on:true,p:'3'},due_over:{on:true,p:'7'},hearing:{on:true,p:'3,1'},effective:{on:true,p:''},writ_not_transferred:{on:true,p:'10'},no_bailiff_payments:{on:true,p:'30'},limitation:{on:true,p:'60,30'},stale:{on:true,p:'30'},summary:{on:true,p:''}},
 integrations:{ad:{url:'ldaps://dc.company.local:636',baseDN:'DC=company,DC=local',group:'GRP_Pretenzii_Peni',sso:'нет'},mail:{host:'smtp.company.local',port:'587',from:'pretenzii@company.local',enabled:false},messenger:{type:'Telegram',token:'',enabled:false}},
 templates:{email:'{event}\nПретензия {reg}, контрагент {cp}, сумма {amount}, срок {date}.\nКарточка: {link}',msg:'{event}: {reg}, {cp}, {amount}. {link}'},
 importMapping:null
};}

/* =================== Утилиты =================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
function TODAY(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toD(s){if(!s)return null;const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function toS(d){return d.toISOString().slice(0,10);}
function addDays(s,n){const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return toS(d);}
function addYears(s,n){const d=toD(s);d.setUTCFullYear(d.getUTCFullYear()+n);return toS(d);}
function days(a,b){return Math.round((toD(b)-toD(a))/86400000);}
function lastDay(y,m){return toS(new Date(Date.UTC(y,m,0)));}
function fmtD(s){if(!s)return '';const[y,m,d]=s.slice(0,10).split('-');return `${d}.${m}.${y}`;}
function fmtDT(s){if(!s)return '';const d=new Date(s);if(isNaN(d))return fmtD(s);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
const NF=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const NI=new Intl.NumberFormat('ru-RU');
const fmtN=n=>NF.format(+n||0), fmtM=n=>NF.format(+n||0)+' ₸', fmtI=n=>NI.format(+n||0);
function fmtRate(n){return String(+n||0).replace('.',',');}
function short(n){n=+n||0;const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(1).replace('.',',')+' млрд';if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' млн';if(a>=1e3)return (n/1e3).toFixed(0)+' тыс';return String(Math.round(n));}
const r2=n=>Math.round((+n||0)*100)/100;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const sum=(a,f=x=>x)=>(a||[]).reduce((s,x)=>s+(+f(x)||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
function parseNum(v){if(v==null||v==='')return null;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/\s| /g,'').replace(',','.'));return isNaN(n)?null:n;}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]];}a[ks[ks.length-1]]=v;}
function opts(list,val,empty){return (empty!=null?`<option value="">${esc(empty)}</option>`:'')+list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`).join('');}
function pill(t,c){return `<span class="pill" style="--c:${c}">${esc(t)}</span>`;}
function toast(msg,err){const el=document.createElement('div');el.className='toast'+(err?' err':'');el.textContent=msg;$('#toast').appendChild(el);setTimeout(()=>el.remove(),err?5000:3200);}
function nowISO(){return new Date().toISOString();}

/* =================== Хранилище =================== */
let DB=null, ME=null, CARD=null, IMP=null, PROFILE=null, CHARTS=[];

const MEM={};let STORAGE_OK=true;
function stGet(store,k){try{return window[store].getItem(k);}catch(e){STORAGE_OK=false;return MEM[store+k]??null;}}
function stSet(store,k,v){try{window[store].setItem(k,v);}catch(e){if(e&&e.name==='QuotaExceededError')throw e;STORAGE_OK=false;MEM[store+k]=v;}}
function stDel(store,k){try{window[store].removeItem(k);}catch(e){delete MEM[store+k];}}
function readDB(){try{const s=stGet('localStorage',LS);if(s)return migrate(JSON.parse(s));}catch(e){}return null;}

function tx(fn){const f=readDB();if(f)DB=f;try{fn(DB);}catch(e){DB=readDB()||DB;throw e;}writeDB();}
function migrate(db){
 const d=defaultSettings();db.settings=Object.assign(d,db.settings||{});
 db.settings.perms=Object.assign(clone(DEFAULT_PERMS),db.settings.perms||{});
 db.settings.events=Object.assign(d.events,db.settings.events||{});
 ['employees','counterparties','contracts','claims','baseRates','audit','notifications','imports','notifKeys'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[];});

const IDB={db:null,

 async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
 async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},

function baseRateAt(d){let r=0;DB.baseRates.slice().sort((a,b)=>a.from<b.from?-1:1).forEach(x=>{if(x.from<=d)r=+x.rate;});return r;}
function calcLine(l,s,contractAmount){
 const out={rows:[],raw:0,total:0,capped:false,cap:null};
 const P=+l.principal||0, rate=+l.rate||0;
 if(!P||!l.dueDate)return out;
 if(l.method==='fine'){const a=r2(P*rate/100);out.rows.push({from:l.dueDate,to:l.dueDate,base:P,days:null,rate:fmtRate(rate)+' % разово',amount:a});out.raw=a;}
 else{
  if(!l.endDate)return out;
  const start=addDays(l.dueDate,1);let end=l.endDate;if(s.dayRule==='next_excl')end=addDays(end,-1);
  if(end<start)return out;
  let base=P;const cuts=new Map();
  (l.partials||[]).filter(p=>p.date&&+p.amount>0).sort((a,b)=>a.date<b.date?-1:1).forEach(p=>{
   if(p.date<start)base-=+p.amount;else if(p.date<end){const d=addDays(p.date,1);cuts.set(d,(cuts.get(d)||0)+(+p.amount));}
  });
  if(l.method==='nbrk')DB.baseRates.forEach(r=>{if(r.from>start&&r.from<=end&&!cuts.has(r.from))cuts.set(r.from,0);});
  const dates=[...cuts.keys()].sort();let ss=start;const segs=[];
  dates.forEach(d=>{segs.push([ss,addDays(d,-1)]);ss=d;});segs.push([ss,end]);
  segs.forEach(([a,b],i)=>{
   if(i>0)base-=cuts.get(a)||0;
   if(base<=0.004)return;const n=days(a,b)+1;if(n<=0)return;let amt,rl;
   if(l.method==='pct'){amt=base*rate/100*n;rl=fmtRate(rate)+' % в день';}
   else if(l.method==='fixed'){amt=rate*n;rl=fmtN(rate)+' ₸ в день';}
   else{const br=baseRateAt(a);amt=base*br/100*n/365;rl=fmtRate(br)+' % годовых';}
   amt=r2(amt);out.rows.push({from:a,to:b,base:r2(base),days:n,rate:rl,amount:amt});out.raw+=amt;
  });
 }
 out.raw=r2(out.raw);out.total=out.raw;
 const cp=+l.capPct||0;
 if(cp>0){const cb=l.capBase==='contract'&&+contractAmount>0?+contractAmount:P;out.cap=r2(cb*cp/100);if(out.raw>out.cap){out.total=out.cap;out.capped=true;}}
 return out;
}
function computeCalc(calc,contractAmount){
 const res={lines:[],total:0};
 (calc&&calc.lines||[]).forEach(ln=>{const l=calc.asOf&&ln.method!=='fine'?{...ln,endDate:calc.asOf}:ln;const r=calcLine(l,DB.settings,contractAmount);res.lines.push(r);res.total+=r.total;});
 res.total=r2(res.total);return res;
}
function met(c){
 const pen=+c.penalty||0, paid=r2(sum(c.payments,p=>p.amount)), rest=r2(pen-paid);

 const sat=filed&&(result==='satisfied_full'||result==='satisfied_partial');
 const awarded=sat?(+ct.awarded||0):0;
 const collected=sat?r2(sum(c.enf&&c.enf.payments,p=>p.amount)):0;
 const enfRest=sat?r2(Math.max(0,awarded-collected)):0;
 let enf=null;if(sat)enf=awarded>0&&collected>=awarded?'full':collected>0?'partial':(c.enf&&c.enf.transferDate)?'at_bailiff':'await';
 let st;if(!filed)st=pay==='full'?'paid':'pretrial';else if(result==='pending')st='court';else if(sat)st=enf==='full'?'sat_collected':enf==='partial'?'sat_partial':'sat_none';else st='rejected';
 const stage=!filed?'pretrial':sat?'enforcement':'court';
 const t=TODAY();
 const overdue=!filed&&rest>0&&!!c.due&&c.due<t;
 const limDate=c.to?addYears(c.to,+DB.settings.limitationYears||3):null;
 const limSoon=!filed&&rest>0&&!!limDate&&days(t,limDate)<=60;
 const dl=[];
 if(!filed&&rest>0&&c.due)dl.push([c.due,'срок оплаты']);
 if(filed&&result==='pending'&&ct.hearing)dl.push([ct.hearing.slice(0,10),'заседание']);
 if(sat&&ct.effectiveDate&&!(c.enf&&c.enf.transferDate))dl.push([addDays(ct.effectiveDate,+DB.settings.events.writ_not_transferred.p||10),'передать ЧСИ']);
 if(!filed&&rest>0&&limDate)dl.push([limDate,'исковая давность']);
 dl.sort((a,b)=>a[0]<b[0]?-1:1);
 return{pen,paid,rest,pay,filed,result,sat,awarded,collected,enfRest,enf,st,stage,overdue,limDate,limSoon,next:dl[0]||null,claimAmount:filed?(+ct.amount||0):0,fee:filed?(+ct.fee||0):0};
}

  const e=DB.employees.find(x=>x.id===eid);if(!e||!e.active)return;
  const pr=(DB.prefs[eid]&&DB.prefs[eid][ev])||{site:true,email:true,msg:true};
  Object.keys(CHANNELS).forEach(ch=>{
   if(!pr[ch])return;let status='доставлено';
   if(ch==='email')status=S.integrations.mail.enabled?'отправлено (демо)':'ошибка: почтовый сервер не настроен — повтор в очереди';
   if(ch==='msg')status=!e.messengerId?'ошибка: мессенджер не привязан':S.integrations.messenger.enabled?'отправлено (демо)':'ошибка: бот не настроен — повтор в очереди';

function runNotifications(){

 const P=k=>String(E[k]&&E[k].p||'').split(/[,;\s]+/).map(Number).filter(x=>x>0);

 const H=heads(),MG=managers();
 DB.claims.filter(c=>!c.deleted).forEach(c=>{
  const m=met(c),ct=c.court||{};

   const d=days(t,c.due),N=P('due_soon')[0]||3;
   if(d>=1&&d<=N)emit(`due_soon|${c.id}|${c.due}`,'due_soon',c,[c.emp],`срок ${fmtD(c.due)}`);
   if(d<=0){const rep=P('due_over')[0]||7;emit(`due_over|${c.id}|${c.due}|${Math.floor(-d/rep)}`,'due_over',c,[c.emp,...H],`срок истёк ${fmtD(c.due)}, остаток ${fmtM(m.rest)}`);}
  }
  if(m.filed&&m.result==='pending'&&ct.hearing){
   const hd=ct.hearing.slice(0,10),d=days(t,hd),nn=P('hearing').sort((a,b)=>a-b).find(x=>d>=0&&d<=x);
   if(nn!=null)emit(`hearing|${c.id}|${hd}|${nn}`,'hearing',c,[c.emp],`заседание ${fmtDT(ct.hearing)}`);
  }

   if(!(c.enf&&c.enf.writNo))emit(`effective|${c.id}|${ct.effectiveDate}`,'effective',c,[c.emp],`вступило в силу ${fmtD(ct.effectiveDate)}`);
   const N=P('writ_not_transferred')[0]||10;
   if(!(c.enf&&c.enf.transferDate)&&days(ct.effectiveDate,t)>=N)emit(`writ|${c.id}|${ct.effectiveDate}`,'writ_not_transferred',c,[c.emp],`решение в силе с ${fmtD(ct.effectiveDate)}`);

  }

   const d=days(t,m.limDate),nn=P('limitation').sort((a,b)=>a-b).find(x=>d>=0&&d<=x);
   if(nn!=null)emit(`lim|${c.id}|${m.limDate}|${nn}`,'limitation',c,[c.emp,...MG],`истекает ${fmtD(m.limDate)}`);
  }

   const N=P('stale')[0]||30,dd=days(c.updatedAt.slice(0,10),t);
   if(dd>=N)emit(`stale|${c.id}|${c.updatedAt.slice(0,10)}`,'stale',c,[c.emp],`нет изменений ${dd} дн.`);
  }
 });
 const wd=toD(t).getUTCDay();
 const L=DB.claims.filter(c=>!c.deleted),ms=L.map(met);
 const brief=`претензий ${L.length}, предъявлено ${fmtM(sum(ms,m=>m.pen))}, оплачено ${fmtM(sum(ms,m=>m.paid))}, у ЧСИ ${fmtM(sum(ms,m=>m.enfRest))}`;
 if(wd===1)emit(`summary|w|${t}`,'summary',null,MG,'неделя: '+brief);

}

     c.enf={...c.enf,writNo:'ИЛ № '+ri(1000,99999),writDate:clampT(addDays(eff,ri(3,10))),bailiff:'ЧСИ исполнительного округа № '+ri(1,40),procNo:''};
     if(sc!=='sat_await'){c.enf.transferDate=clampT(addDays(eff,ri(10,20)));c.enf.procNo='ИП-'+ri(10000,99999);lastAct=c.enf.transferDate;}
     else{c.enf.writNo='';c.enf.writDate='';c.enf.bailiff='';}
     if(sc==='sat_coll')c.enf.payments=pays(c.court.awarded,addDays(c.enf.transferDate,10),clampT(addDays(c.enf.transferDate,90)),ri(1,3),'вручную');
     if(sc==='sat_part')c.enf.payments=pays(r2(c.court.awarded*(0.25+R()*0.35)),addDays(c.enf.transferDate,10),clampT(addDays(c.enf.transferDate,60)),1,'вручную');
    }
   }
  }
  c.createdAt=date+'T10:'+pad(ri(0,59))+':00';c.createdBy=emp;c.updatedAt=(lastAct>date?lastAct:date)+'T15:'+pad(ri(0,59))+':00';c.updatedBy=emp;c.version=1;
  list.push(c);
 }
 list.sort((a,b)=>a.date<b.date?-1:1);
 const seq={};list.forEach(c=>{const y=c.date.slice(0,4);seq[y]=(seq[y]||0)+1;c.reg=`П-${y}-${String(seq[y]).padStart(4,'0')}`;});
 db.claims=list;
 list.forEach(c=>{
  db.audit.push({id:uid(),ts:c.createdAt,actor:c.emp,actorName:empName(c.emp),login:'user'+c.emp.slice(1),action:'create',claimId:c.id,reg:c.reg,field:'',old:'',new:'',note:`Создана претензия ${c.reg}`});

 });
 db.audit.sort((a,b)=>a.ts<b.ts?-1:1);

}

function openModal(html,cls=''){$('#modal-root').innerHTML=`<div class="modal-back"><div class="modal ${cls}">${html}</div></div>`;}

function syncInputs(){

}
function fld(label,path,o={}){
 const v=getP(CARD.c,path),dis=(o.dis||CARD.ro)?'disabled':'',r=o.r?'data-r':'',t=o.t?`data-t="${o.t}"`:'';let ctl;
 if(o.type==='checkbox')return `<label class="chk ${o.full?'full':''}"><input type="checkbox" data-b="${path}" data-t="bool" ${r} ${v?'checked':''} ${dis}> ${label}</label>`;
 if(o.opts)ctl=`<select data-b="${path}" ${t} ${r} ${dis}>${opts(o.opts,v,o.empty)}</select>`;
 else if(o.type==='textarea')ctl=`<textarea data-b="${path}" rows="${o.rows||2}" ${dis}>${esc(v)}</textarea>`;
 else ctl=`<input type="${o.type||'text'}" data-b="${path}" ${t} ${r} value="${esc(v??'')}" ${o.list?`list="${o.list}"`:''} ${o.step?`step="${o.step}"`:''} ${o.type==='number'?'min="0"':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.max?`maxlength="${o.max}"`:''} ${dis}>`;
 return `<label class="f ${o.full?'full':''}"><span>${label}${o.req?' <i>*</i>':''}</span>${ctl}${o.hint||o.hintId?`<small ${o.hintId?`id="${o.hintId}"`:''}>${o.hint||''}</small>`:''}</label>`;
}

  ${fld('Период начисления пени — по','to',{type:'date',req:1})}
  ${fld('Основание / предмет','basis',{ph:'например, просрочка поставки'})}

  ${c.penaltyManual?fld('Причина ручного изменения суммы пени','manualReason',{req:1,full:1,ph:'попадёт в журнал изменений'}):''}
  ${fld('Примечание','note',{type:'textarea',full:1,rows:3})}
 </div>
 <datalist id="dl-cp">${DB.counterparties.map(x=>`<option value="${esc(x.name)}">${esc(x.bin)}</option>`).join('')}</datalist>
 <datalist id="dl-ct">${cts.map(x=>`<option value="${esc(x.number)}">от ${fmtD(x.date)}</option>`).join('')}</datalist>
 ${!CARD.isNew?`<p class="small mut" style="margin-top:14px">Создал: ${esc(empName(c.createdBy))}, ${fmtDT(c.createdAt)} · Изменил: ${esc(empName(c.updatedBy))}, ${fmtDT(c.updatedAt)} · версия ${c.version}${c.importId?' · загружено импортом':''}</p>`:''}`;
}
function defaultLine(){
 const c=CARD.c,S=DB.settings,ct=DB.contracts.find(x=>x.id===c.contractId);
 return{id:uid(),principal:c.contractAmount||null,dueDate:c.from?addDays(c.from,-1):'',endDate:c.to||'',method:ct&&ct.method||S.defaultMethod,rate:ct&&ct.rate!=null?ct.rate:S.defaultRate,capPct:ct&&ct.capPct!=null?ct.capPct:S.defaultCapPct,capBase:'obligation',partials:[]};
}
function cardCalc(){
 const c=CARD.c,dis=CARD.ro?'disabled':'';
 if(!c.calc)c.calc={lines:[],asOf:'',total:0};
 const L=c.calc.lines;
 const rateLabel=m=>m==='pct'?'Ставка, % в день':m==='fixed'?'Сумма в день, ₸':m==='fine'?'Штраф, % от суммы':'Ставка НБ РК — по справочнику';
 return `<div class="info">Дни просрочки считаются ${DB.settings.dayRule==='next_incl'?'со дня, следующего за сроком исполнения, по день исполнения <b>включительно</b>':'со дня, следующего за сроком исполнения, <b>без</b> дня исполнения'} (календарные дни). Частичное исполнение уменьшает базу со следующего дня. Для метода НБ РК период делится при смене ставки.</div>
 ${L.map((l,i)=>`<div class="box"><div class="box-h"><b>Строка ${i+1}</b><span class="mut small">${esc(METHODS[l.method])}</span><span class="spacer"></span>${!CARD.ro?`<button class="btn sm danger" data-a="calcDelLine" data-i="${i}">Удалить строку</button>`:''}</div>
  <div class="grid">
   ${fld('Сумма просроченного обязательства, ₸',`calc.lines.${i}.principal`,{type:'number',t:'num',step:'0.01'})}

   ${fld('Дата исполнения / расчёта',`calc.lines.${i}.endDate`,{type:'date',dis:l.method==='fine'})}
   ${fld('Метод расчёта',`calc.lines.${i}.method`,{opts:Object.entries(METHODS),r:1})}
   ${l.method!=='nbrk'?fld(rateLabel(l.method),`calc.lines.${i}.rate`,{type:'number',t:'num',step:'0.001'}):`<label class="f"><span>Ставка</span><input disabled value="по справочнику ставок НБ РК"></label>`}
   ${fld('Ограничение пени, % (0 — без лимита)',`calc.lines.${i}.capPct`,{type:'number',t:'num',step:'0.01'})}
   ${fld('Лимит считается от',`calc.lines.${i}.capBase`,{opts:[['obligation','суммы обязательства'],['contract','суммы договора']]})}
  </div>
  ${l.method!=='fine'?`<div class="sec">Частичные исполнения внутри периода</div>
  ${(l.partials||[]).length?`<table class="tbl" style="max-width:560px"><thead><tr><th>Дата</th><th>Сумма, ₸</th><th></th></tr></thead><tbody>${l.partials.map((p,j)=>`<tr><td><input type="date" data-b="calc.lines.${i}.partials.${j}.date" value="${p.date||''}" ${dis}></td><td><input type="number" step="0.01" min="0" data-t="num" data-b="calc.lines.${i}.partials.${j}.amount" value="${p.amount??''}" ${dis}></td><td>${!CARD.ro?`<button class="x" data-a="calcDelPartial" data-i="${i}" data-j="${j}">✕</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="small mut" style="margin:0">нет</p>'}
  ${!CARD.ro?`<button class="btn sm" style="margin-top:8px" data-a="calcAddPartial" data-i="${i}">+ Частичное исполнение</button>`:''}`:''}
 </div>`).join('')}
 ${!CARD.ro?`<button class="btn" data-a="calcAddLine">+ Строка расчёта (обязательство)</button>`:''}
 <div class="box" style="margin-top:14px"><div class="box-h"><b>Пересчёт на дату</b><span class="small mut">например, на дату подачи иска — заменяет дату расчёта во всех строках</span></div>
  <div class="toolbar"><input type="date" data-b="calc.asOf" value="${c.calc.asOf||''}" ${dis}>${!CARD.ro?`<button class="btn sm" data-a="calcAsOfToday">Сегодня</button>${c.court.filedDate?`<button class="btn sm" data-a="calcAsOfSuit">На дату иска (${fmtD(c.court.filedDate)})</button>`:''}<button class="btn sm" data-a="calcAsOfClear">Сбросить</button>`:''}</div></div>

 </div>`;
}
function calcResultHTML(){
 const c=CARD.c;if(!c.calc||!c.calc.lines.length)return '<p class="mut" style="margin-top:14px">Добавьте строку расчёта.</p>';
 const R=computeCalc(c.calc,c.contractAmount);
 return `<div class="sec">Результат расчёта${c.calc.asOf?` на ${fmtD(c.calc.asOf)}`:''}</div>
 ${R.lines.map((r,i)=>{const l=c.calc.lines[i];return `<div class="box"><div class="box-h"><b>Строка ${i+1}</b><span class="mut small">обязательство ${fmtM(l.principal)} · ${esc(METHODS[l.method])}</span></div>
 ${r.rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Период с</th><th>по</th><th class="num">База, ₸</th><th class="num">Дней</th><th>Ставка</th><th class="num">Пеня, ₸</th></tr></thead><tbody>
 ${r.rows.map(x=>`<tr><td>${fmtD(x.from)}</td><td>${fmtD(x.to)}</td><td class="num">${fmtN(x.base)}</td><td class="num">${x.days??'—'}</td><td>${esc(x.rate)}</td><td class="num">${fmtN(x.amount)}</td></tr>`).join('')}
 </tbody><tfoot><tr><td colspan="5">Начислено${r.capped?` · <span class="amber">лимит ${fmtN(r.cap)} ₸ — сумма срезана до лимита</span>`:r.cap!=null?` · лимит ${fmtN(r.cap)} ₸ не превышен`:''}</td><td class="num">${r.capped?`<s class="mut">${fmtN(r.raw)}</s> `:''}${fmtN(r.total)}</td></tr></tfoot></table></div>`:'<p class="small mut">Недостаточно данных или нет дней просрочки.</p>'}</div>`;}).join('')}
 <div class="toolbar"><span>Итого пеня по расчёту:</span><span class="total-big">${fmtM(R.total)}</span>${Math.abs(R.total-(+c.penalty||0))>0.009?`<span class="tag">в претензии: ${fmtM(c.penalty)}</span>`:'<span class="pill" style="--c:#16a34a">совпадает с суммой претензии</span>'}</div>`;

function validate(c){

 }
 return E;
}

function fmtCell(v){if(v instanceof Date)return fmtD(parseDateAny(v));return v==null?'':String(v);}
function loadImpSheet(){
 const ws=IMP.wb.Sheets[IMP.sheet];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
 IMP.headers=(aoa[0]||[]).map(h=>String(h).trim());
 IMP.rows=aoa.slice(1).filter(r=>r.some(v=>v!==''&&v!=null));
 const saved=DB.settings.importMapping||{};IMP.mapping={};
 IMP_FIELDS.forEach(([k,l])=>{let i=IMP.headers.findIndex(h=>norm(h)===norm(l));if(i<0&&saved[k]){i=IMP.headers.findIndex(h=>norm(h)===norm(saved[k]));}if(i<0){const nl=norm(l).slice(0,12);i=IMP.headers.findIndex(h=>norm(h).startsWith(nl)&&nl.length>5);}IMP.mapping[k]=i>=0?i:null;});
}
function readPaySheet(name){
 if(!name)return [];const aoa=XLSX.utils.sheet_to_json(IMP.wb.Sheets[name],{header:1,raw:true,defval:''});const H=(aoa[0]||[]).map(norm);
 const f=k=>H.findIndex(h=>h.includes(k));const ir=f('претенз'),id=f('дата'),ia=f('сумм'),idoc=f('документ'),inote=f('примеч');
 return aoa.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>({reg:String(r[ir]??'').trim(),date:parseDateAny(r[id]),amount:parseNum(r[ia]),doc:idoc>=0?String(r[idoc]??''):'',note:inote>=0?String(r[inote]??''):''})).filter(p=>p.reg&&p.date&&p.amount>0);
}
function impCheck(){
 if($('#imp-save-map')&&$('#imp-save-map').checked){const m={};IMP_FIELDS.forEach(([k])=>{if(IMP.mapping[k]!=null)m[k]=IMP.headers[IMP.mapping[k]];});tx(db=>{db.settings.importMapping=m;});}
 const regsInFile=new Set();
 IMP.preview=IMP.rows.map((r,idx)=>{
  const o={},errors=[];
  IMP_FIELDS.forEach(([k,l,req,t])=>{const ci=IMP.mapping[k];let v=ci==null?'':r[ci];
   if(t==='date'){const d=parseDateAny(v);if(d===null){errors.push(`${l}: неверная дата`);v='';}else v=d;}
   else if(t==='num'){if(v===''||v==null)v=null;else{const n=parseNum(v);if(n==null){errors.push(`${l}: не число`);}else if(n<0)errors.push(`${l}: отрицательная сумма`);v=n;}}
   else if(t==='bool')v=/^(да|yes|1|true|\+)$/i.test(String(v).trim());
   else v=String(v??'').trim();
   o[k]=v;if(req&&(v===''||v==null))errors.push(`не заполнено «${l}»`);});
  if(o.bin&&!/^\d{12}$/.test(o.bin.replace(/\s/g,'')))errors.push('БИН — не 12 цифр');else o.bin=o.bin.replace(/\s/g,'');
  if(o.from&&o.to&&o.to<o.from)errors.push('период: «по» раньше «с»');
  const e=DB.employees.find(x=>x.name.toLowerCase()===String(o.emp).toLowerCase());
  if(o.emp&&!e)errors.push(`исполнитель «${o.emp}» не найден в справочнике`);
  if(o.result){const pr=parseResult(o.result);if(pr===null)errors.push('решение суда не распознано');o.result=pr;}
  if(o.reg){if(regsInFile.has(o.reg))errors.push('№ претензии повторяется в файле');regsInFile.add(o.reg);}
  let dup=null,dupBy='';
  if(o.reg){dup=DB.claims.find(c=>!c.deleted&&c.reg===o.reg);if(dup)dupBy='по № претензии';}
  if(!dup&&o.bin&&o.contractNo){dup=DB.claims.find(c=>!c.deleted&&c.bin===o.bin&&c.contractNo===o.contractNo&&c.from===o.from&&c.to===o.to);if(dup)dupBy='БИН + договор + период';}
  return{row:idx+2,raw:r,o,errors,empId:e?e.id:null,empLabel:e?e.name:o.emp,dup:dup?dup.id:null,dupReg:dup?dup.reg:'',dupBy,action:'skip'};
 });
 IMP.pays=readPaySheet(IMP.paySheet);IMP.epays=readPaySheet(IMP.enfSheet);
 IMP.stage='preview';renderContent();
}
function impCommit(){
 try{
  let res;
  tx(db=>{
   const imp={id:uid(),fileName:IMP.fileName,total:IMP.preview.length,created:0,updated:0,skipped:0,by:ME.id,at:nowISO(),rolledBack:false};
   const regMap={},now=nowISO();
   IMP.preview.forEach(p=>{
    if(p.errors.length||(p.dup&&p.action==='skip')){imp.skipped++;return;}
    const o=p.o;let c;
    const upd=p.dup&&p.action==='update';
    if(upd)c=db.claims.find(x=>x.id===p.dup);
    else{c=blankClaim();c.importId=imp.id;c.createdAt=now;c.createdBy=ME.id;c.version=0;}
    const before=clone(c);
    ['date','cpName','bin','contractNo','contractDate','contractAmount','from','to','basis','penalty','due','note'].forEach(k=>{if(o[k]!==''&&o[k]!=null)c[k]=o[k];});
    c.emp=p.empId;
    if(!c.due&&c.date)c.due=addDays(c.date,+db.settings.dueDays||10);
    if(o.filed||o.filedDate||o.caseNo){c.court.filed=true;[['filedDate','filedDate'],['court','court'],['caseNo','caseNo'],['claimAmount','amount'],['fee','fee'],['decisionDate','decisionDate'],['effectiveDate','effectiveDate'],['awarded','awarded']].forEach(([a,b])=>{if(o[a]!==''&&o[a]!=null)c.court[b]=o[a];});if(o.hearing)c.court.hearing=o.hearing+'T10:00';c.court.result=o.result||c.court.result||'pending';}
    [['writNo','writNo'],['writDate','writDate'],['bailiff','bailiff'],['transferDate','transferDate'],['procNo','procNo']].forEach(([a,b])=>{if(o[a])c.enf[b]=o[a];});
    let cp=db.counterparties.find(x=>x.name.toLowerCase()===c.cpName.toLowerCase());if(!cp){cp={id:uid(),name:c.cpName,bin:c.bin};db.counterparties.push(cp);}c.cpId=cp.id;
    let ct=db.contracts.find(x=>x.cpId===cp.id&&x.number===c.contractNo);if(!ct){ct={id:uid(),cpId:cp.id,number:c.contractNo,date:c.contractDate||'',amount:c.contractAmount,method:db.settings.defaultMethod,rate:db.settings.defaultRate,capPct:db.settings.defaultCapPct};db.contracts.push(ct);}c.contractId=ct.id;
    c.updatedAt=now;c.updatedBy=ME.id;c.version=(c.version||0)+1;
    if(upd){imp.updated++;diffClaim(before,c).forEach(([f,a,b])=>audit('update',{claimId:c.id,reg:c.reg,field:f,old:a,new:b,note:'импорт '+IMP.fileName}));}
    else{c.reg=o.reg&&!db.claims.some(x=>x.reg===o.reg&&!x.deleted)?o.reg:nextReg(db,c.date);db.claims.push(c);imp.created++;audit('create',{claimId:c.id,reg:c.reg,note:`Создана импортом (${IMP.fileName})`});}
    regMap[o.reg||c.reg]=c;regMap[c.reg]=c;
   });
   let np=0,ne=0;
   IMP.pays.forEach(p=>{const c=regMap[p.reg];if(!c)return;c.payments.push({id:uid(),date:p.date,amount:p.amount,doc:p.doc,note:p.note,source:'импорт'});np++;});
   IMP.epays.forEach(p=>{const c=regMap[p.reg];if(!c)return;c.enf.payments.push({id:uid(),date:p.date,amount:p.amount,doc:p.doc,note:p.note,source:'импорт'});ne++;});
   db.imports.push(imp);
   audit('import',{note:`Импорт: ${imp.created+imp.updated} записей, файл ${IMP.fileName}, сотрудник ${ME.name}`,field:'Импорт',new:`создано ${imp.created}, обновлено ${imp.updated}, пропущено ${imp.skipped}`});
   res={...imp,pays:np,epays:ne};
  });
  IMP.result=res;IMP.stage='done';runNotifications();renderContent();toast('Импорт выполнен');
 }catch(e){console.error(e);toast('Критическая ошибка импорта — изменения отменены: '+e.message,true);}
}

function dIn(dir,id,k,val,o={}){const t=o.t?`data-t="${o.t}"`:'';const a=`data-dir="${dir}" data-id="${id}" data-k="${k}" ${t}`;if(o.opts)return `<select ${a}>${opts(o.opts,val)}</select>`;if(o.type==='checkbox')return `<input type="checkbox" ${a} data-t="bool" ${val?'checked':''}>`;return `<input type="${o.type||'text'}" ${a} value="${esc(val??'')}" ${o.step?`step="${o.step}"`:''} ${o.max?`maxlength="${o.max}"`:''}>`;}

function xlsxExport(sheets,filename){
 if(!window.XLSX){toast('Библиотека Excel не загрузилась (нужен интернет)',true);return;}
 const wb=XLSX.utils.book_new();
 sheets.forEach(({name,header,rows})=>{
  const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
  const money=header.map((h,i)=>/₸|сумм|оплачен|остаток|пеня|взыскан|госпошлин|у чси|база/i.test(h)?i:-1).filter(i=>i>=0);
  const rg=XLSX.utils.decode_range(ws['!ref']);
  for(let R=1;R<=rg.e.r;R++)money.forEach(C=>{const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];if(cell&&cell.t==='n')cell.z='#,##0.00';});
  ws['!cols']=header.map((h,i)=>({wch:Math.min(45,Math.max(10,String(h).length+2,...rows.slice(0,200).map(r=>String(r[i]??'').length+1)))}));
  if(rows.length)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:header.length-1}})};
  ws['!views']=[{state:'frozen',ySplit:1}];
  XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
 });
 XLSX.writeFile(wb,filename);
}

 <h1>Расчёт пени по претензии № ${esc(c.reg)} от ${fmtD(c.date)}</h1>
 <p>Контрагент: <b>${esc(c.cpName)}</b>, БИН ${esc(c.bin)}</p><p>Договор № ${esc(c.contractNo)}${c.contractDate?' от '+fmtD(c.contractDate):''}${c.contractAmount?', сумма '+fmtM(c.contractAmount):''}</p>
 ${c.calc.asOf?`<p>Расчёт на дату: <b>${fmtD(c.calc.asOf)}</b></p>`:''}
 ${R.lines.map((r,i)=>{const l=c.calc.lines[i];return `<p><b>Обязательство ${i+1}:</b> ${fmtM(l.principal)}, срок исполнения ${fmtD(l.dueDate)}, метод: ${esc(METHODS[l.method])}</p><table><tr><th>Период с</th><th>по</th><th>База, ₸</th><th>Дней</th><th>Ставка</th><th>Пеня, ₸</th></tr>${r.rows.map(x=>`<tr><td>${fmtD(x.from)}</td><td>${fmtD(x.to)}</td><td class="n">${fmtN(x.base)}</td><td class="n">${x.days??'—'}</td><td>${esc(x.rate)}</td><td class="n">${fmtN(x.amount)}</td></tr>`).join('')}<tr><td colspan="5"><b>Итого${r.capped?` (ограничено лимитом ${fmtN(r.cap)} ₸; начислено ${fmtN(r.raw)} ₸)`:''}</b></td><td class="n"><b>${fmtN(r.total)}</b></td></tr></table>`;}).join('')}
 <p style="font-size:15px">Итого пеня: <b>${fmtM(R.total)}</b></p><p style="margin-top:30px">Исполнитель: ${esc(empName(c.emp))} ____________________ &nbsp; Дата: ${fmtD(TODAY())}</p>
 <script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close();
}

/* =================== Действия =================== */
const ACT={
 login(){const id=$('#login-emp').value;setSession({empId:id,loginAt:Date.now(),last:Date.now()});refreshMe();tx(()=>audit('login',{note:'Вход через корпоративную учётную запись (демо)'}));runNotifications();render();toast('Добро пожаловать, '+ME.name);openFromHash();},
 logout(){tx(()=>audit('logout',{}));setSession(null);ME=null;closeModal();UI.bell=false;render();},
 tab(el){UI.tab=el.dataset.t;UI.bell=false;render();},
 quick(el){const q=el.dataset.q,t=TODAY(),[y,m]=t.split('-').map(Number);UI.quick=q;
  if(q==='month'){UI.f.from=`${y}-${pad(m)}-01`;UI.f.to=lastDay(y,m);}
  if(q==='quarter'){const s=Math.floor((m-1)/3)*3+1;UI.f.from=`${y}-${pad(s)}-01`;UI.f.to=lastDay(y,s+2);}
  if(q==='year'){UI.f.from=`${y}-01-01`;UI.f.to=`${y}-12-31`;}
  if(q==='all'){UI.f.from='';UI.f.to='';}
  UI.page=1;render();},
 resetF(){UI.f={from:'',to:'',emp:'',status:'',pay:'',stage:'',result:'',enf:'',q:''};UI.quick='all';UI.page=1;render();},
 empFilter(el){UI.f.emp=el.dataset.id;UI.tab='registry';UI.page=1;render();},
 sort(el){const k=el.dataset.k;UI.sort=UI.sort.k===k?{k,d:-UI.sort.d}:{k,d:1};renderContent();},
 page(el){UI.page=+el.dataset.p;renderContent();},
 newClaim(){newClaim();},
 openClaim(el){openClaim(el.dataset.id);},
 closeCard(){if(CARD&&!CARD.ro&&JSON.stringify(CARD.c)!==JSON.stringify(CARD.orig)&&!confirm('Закрыть без сохранения изменений?'))return;closeModal();},
 closeModal(){closeModal();},
 ctab(el){CARD.tab=el.dataset.t;renderCardBody();},
 saveCard(){saveCard();},
 claimDelete(){const c=CARD.c;if(!confirm(`Удалить претензию ${c.reg}? Её можно будет восстановить.`))return;tx(db=>{const x=db.claims.find(y=>y.id===c.id);x.deleted=true;x.updatedAt=nowISO();x.updatedBy=ME.id;x.version++;audit('delete',{claimId:x.id,reg:x.reg,note:'Претензия удалена (мягкое удаление)'});});closeModal();renderContent();toast('Претензия удалена');},
 restore(el){const id=el.dataset.id;tx(db=>{const x=db.claims.find(y=>y.id===id);x.deleted=false;x.updatedAt=nowISO();x.updatedBy=ME.id;x.version++;audit('restore',{claimId:x.id,reg:x.reg,note:'Претензия восстановлена'});});closeModal();renderContent();toast('Претензия восстановлена');},
 payAdd(el){const p=el.dataset.p;getP(CARD.c,p).push({id:uid(),date:TODAY(),amount:null,doc:'',note:'',source:'вручную'});renderCardBody();},
 payDel(el){const arr=getP(CARD.c,el.dataset.p);arr.splice(+el.dataset.i,1);renderCardBody();},
 calcAddLine(){if(!CARD.c.calc)CARD.c.calc={lines:[],asOf:'',total:0};CARD.c.calc.lines.push(defaultLine());renderCardBody();},
 calcDelLine(el){CARD.c.calc.lines.splice(+el.dataset.i,1);renderCardBody();},
 calcAddPartial(el){const l=CARD.c.calc.lines[+el.dataset.i];(l.partials=l.partials||[]).push({id:uid(),date:'',amount:null});renderCardBody();},
 calcDelPartial(el){CARD.c.calc.lines[+el.dataset.i].partials.splice(+el.dataset.j,1);renderCardBody();},
 calcAsOfToday(){CARD.c.calc.asOf=TODAY();renderCardBody();},
 calcAsOfSuit(){CARD.c.calc.asOf=CARD.c.court.filedDate;renderCardBody();},
 calcAsOfClear(){CARD.c.calc.asOf='';renderCardBody();},
 calcApply(){const c=CARD.c,R=computeCalc(c.calc,c.contractAmount);c.penalty=R.total;c.calc.total=R.total;c.penaltyManual=false;c.manualReason='';renderCardBody();toast('Сумма пени перенесена в претензию: '+fmtM(R.total));},
 calcXlsx(){calcXlsx();},calcPdf(){calcPdf();},
 courtRest(){CARD.c.court.amount=r2(Math.max(0,met(CARD.c).rest));renderCardBody();},
 courtRecalc(){const c=CARD.c;if(!c.court.filedDate){toast('Укажите дату подачи иска',true);return;}if(!c.calc||!c.calc.lines.length){toast('Нет расчёта пени — заполните вкладку «Расчёт пени»',true);return;}const R=computeCalc({...c.calc,asOf:c.court.filedDate},c.contractAmount);c.court.amount=r2(Math.max(0,R.total-met(c).paid));renderCardBody();toast(`Пеня на ${fmtD(c.court.filedDate)}: ${fmtM(R.total)}; сумма иска (за вычетом оплат): ${fmtM(c.court.amount)}`);},
 async fileUpload(){
  const inp=$('#file-inp'),type=$('#file-type').value;if(!inp.files.length){toast('Выберите файл',true);return;}
  for(const f of inp.files){const ext=f.name.split('.').pop().toLowerCase();if(!FILE_EXT.includes(ext)){toast(`${f.name}: формат не поддерживается`,true);continue;}if(f.size>20*1024*1024){toast(`${f.name}: больше 20 МБ`,true);continue;}
   const id=uid();try{await IDB.put(id,f);}catch(e){toast('Не удалось сохранить файл: '+e.message,true);continue;}
   CARD.c.files.push({id,type,name:f.name,size:f.size,mime:f.type,by:ME.id,at:nowISO(),deleted:false,_new:true});}
  renderCardBody();toast('Файл добавлен — сохраните претензию');
 },
 async fileView(el){const b=await IDB.get(el.dataset.id).catch(()=>null);if(!b){toast('Файл не найден в хранилище браузера',true);return;}window.open(URL.createObjectURL(b),'_blank');},
 async fileDl(el){const f=CARD.c.files.find(x=>x.id===el.dataset.id);const b=await IDB.get(el.dataset.id).catch(()=>null);if(!b){toast('Файл не найден в хранилище браузера',true);return;}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();},
 fileDel(el){const f=CARD.c.files.find(x=>x.id===el.dataset.id);if(!confirm(`Удалить файл «${f.name}»?`))return;f.deleted=true;f._del=true;renderCardBody();},
 jsub(el){UI.j.sub=el.dataset.v;renderContent();},
 exportRegistry(){exportRegistry();},exportSummary(){exportSummary();},exportJournal(){exportJournal();},
 ssub(el){UI.s=el.dataset.v;renderContent();},
 empAdd(){tx(db=>{const n=db.employees.length+1;db.employees.push({id:uid(),name:'Сотрудник '+n,position:'Специалист',login:'user'+n,email:`user${n}@company.local`,role:'executor',active:true,messengerId:''});audit('settings',{field:'Сотрудники',new:'добавлен Сотрудник '+n});});renderContent();},
 cpAdd(){tx(db=>{db.counterparties.push({id:uid(),name:'Новый контрагент',bin:'000000000000'});audit('settings',{field:'Контрагенты',new:'добавлен контрагент'});});renderContent();},
 ctAdd(){if(!DB.counterparties.length){toast('Сначала добавьте контрагента',true);return;}tx(db=>{db.contracts.push({id:uid(),cpId:db.counterparties[0].id,number:'Новый договор',date:TODAY(),amount:null,method:db.settings.defaultMethod,rate:db.settings.defaultRate,capPct:db.settings.defaultCapPct});audit('settings',{field:'Договоры',new:'добавлен договор'});});renderContent();},
 rateAdd(){tx(db=>{db.baseRates.push({id:uid(),from:TODAY(),rate:0});audit('settings',{field:'Ставки НБ РК',new:'добавлена ставка с '+fmtD(TODAY())});});renderContent();},
 rateDel(el){const r=DB.baseRates.find(x=>x.id===el.dataset.id);if(!confirm(`Удалить ставку с ${fmtD(r.from)}?`))return;tx(db=>{db.baseRates=db.baseRates.filter(x=>x.id!==el.dataset.id);audit('settings',{field:'Ставки НБ РК',old:`${fmtD(r.from)}: ${r.rate}%`,new:'удалена'});});renderContent();},
 runNotif(){const n=runNotifications();updateBell();toast(n?`Сформировано событий: ${n}`:'Новых событий нет');},
 testConn(el){toast(`Демо-режим: проверка подключения к ${el.dataset.v} не выполняется. Параметры сохранены.`);},
 backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download=`Реестр_претензий_backup_${fmtD(TODAY())}.json`;a.click();},
 resetDemo(){if(!confirm('Заменить все данные демонстрационными? Текущие данные будут потеряны.'))return;const me=ME&&ME.id;DB=seed();writeDB();IDB.clear().catch(()=>{});runNotifications();if(me&&!DB.employees.find(e=>e.id===me))setSession(null);render();toast('Загружены демо-данные');},
 clearAll(){if(!confirm('Удалить все претензии, журнал и уведомления? Сотрудники и справочники сохранятся.'))return;tx(db=>{db.claims=[];db.audit=[];db.notifications=[];db.notifKeys=[];db.imports=[];audit('settings',{field:'Данные',new:'реестр очищен'});});IDB.clear().catch(()=>{});render();},
 profile(){PROFILE=null;showProfile();},
 msgCode(){PROFILE.code=String(Math.floor(100000+Math.random()*900000));showProfile();},
 msgConfirm(){tx(db=>{const e=db.employees.find(x=>x.id===ME.id);e.messengerId='@'+e.login;audit('settings',{field:'Привязка мессенджера',new:e.messengerId});});refreshMe();PROFILE.code=null;showProfile();toast('Мессенджер привязан');},
 msgUnbind(){tx(db=>{const e=db.employees.find(x=>x.id===ME.id);audit('settings',{field:'Привязка мессенджера',old:e.messengerId,new:''});e.messengerId='';});refreshMe();showProfile();},
 profileSave(){const p={};document.querySelectorAll('[data-pref]').forEach(el=>{const[k,ch]=el.dataset.pref.split('.');p[k]=p[k]||{};p[k][ch]=el.checked;});tx(db=>{db.prefs[ME.id]=p;audit('settings',{field:'Профиль: настройки уведомлений',new:'обновлены'});});closeModal();toast('Настройки уведомлений сохранены');},
 bell(){UI.bell=!UI.bell;updateBell();},
 bellReadAll(){tx(db=>db.notifications.forEach(n=>{if(n.emp===ME.id)n.read=true;}));updateBell();},
 bellOpen(el){let cid=null;tx(db=>{const n=db.notifications.find(x=>x.id===el.dataset.id);if(n){n.read=true;cid=n.claimId;}});UI.bell=false;updateBell();if(cid)openClaim(cid);},
 impTemplate(){xlsxExport([{name:'Претензии',header:IMP_FIELDS.map(f=>f[1]),rows:[['П-2025-0001','15.03.2025','Сотрудник 4','ТОО «Пример»','123456789012','12-П/2024','10.01.2024',50000000,'01.02.2025','28.02.2025','Просрочка поставки',1400000,'25.03.2025','', 'нет','','','','','','','','','','','','','','','']]},{name:'Оплаты',header:PAY_HDR,rows:[['П-2025-0001','01.04.2025',500000,'ПП № 123','']]},{name:'Поступления по решению',header:PAY_HDR,rows:[]}],'Шаблон_импорта_претензий.xlsx');},
 impCancel(){IMP=null;renderContent();},
 impCheck(){impCheck();},
 impBack(){IMP.stage='map';renderContent();},
 impDupAll(el){IMP.preview.forEach(p=>{if(p.dup&&!p.errors.length)p.action=el.dataset.v;});renderContent();},
 impCommit(){const ok=IMP.preview.filter(p=>!p.errors.length&&!(p.dup&&p.action==='skip')).length;if(!confirm(`Загрузить ${ok} строк?`))return;impCommit();},
 impErrors(){const bad=IMP.preview.filter(p=>p.errors.length);xlsxExport([{name:'Ошибки',header:['Строка файла',...IMP.headers,'Ошибка'],rows:bad.map(p=>[p.row,...IMP.headers.map((h,i)=>fmtCell(p.raw[i])),p.errors.join('; ')])}],`Ошибки_импорта_${fmtD(TODAY())}.xlsx`);},
 impRollback(el){const h=DB.imports.find(x=>x.id===el.dataset.id);if(!confirm(`Отменить импорт «${h.fileName}»? Созданные им претензии (${h.created}) будут помечены удалёнными.`))return;let n=0;tx(db=>{const x=db.imports.find(y=>y.id===h.id);db.claims.forEach(c=>{if(c.importId===h.id&&!c.deleted){c.deleted=true;c.updatedAt=nowISO();c.updatedBy=ME.id;c.version++;n++;}});x.rolledBack=true;audit('import_rollback',{field:'Импорт',note:`Отмена импорта «${h.fileName}»: удалено ${n} записей`});});renderContent();toast(`Импорт отменён, удалено записей: ${n}`);}
};

/* =================== События =================== */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(UI.bell&&!e.target.closest('.bell-wrap')){UI.bell=false;updateBell();}
 if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.closest&&el.closest('#card-body')&&el.dataset.b){onCardField(e);return;}
 if(el.dataset.f==='q'){UI.f.q=el.value;UI.page=1;renderContent();return;}
 if(el.dataset.j==='q'){UI.j.q=el.value;const pos=el.selectionStart;renderContent();const n=document.querySelector('[data-j="q"]');if(n){n.focus();n.setSelectionRange(pos,pos);}return;}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.closest&&el.closest('#card-body')&&el.dataset.b){onCardField(e);return;}
 if(el.dataset.f&&el.dataset.f!=='q'){UI.f[el.dataset.f]=el.value;if(el.dataset.f==='from'||el.dataset.f==='to')UI.quick='';UI.page=1;render();return;}
 if(el.dataset.j&&el.dataset.j!=='q'){UI.j[el.dataset.j]=el.value;renderContent();return;}
 if(el.dataset.ui==='size'){UI.size=+el.value;UI.page=1;renderContent();return;}
 if(el.dataset.ui==='showDeleted'){UI.showDeleted=el.checked;UI.page=1;renderContent();return;}
 if(el.dataset.s||el.dataset.dir){onSettingChange(el);return;}
 if(el.dataset.map){IMP.mapping[el.dataset.map]=el.value===''?null:+el.value;renderContent();return;}
 if(el.dataset.imp==='sheet'){IMP.sheet=el.value;loadImpSheet();renderContent();return;}
 if(el.dataset.dup!=null){IMP.preview[+el.dataset.dup].action=el.value;return;}
 if(el.id==='imp-file'&&el.files[0]){
  if(!window.XLSX){toast('Библиотека Excel не загрузилась (нужен интернет)',true);return;}
  const file=el.files[0];file.arrayBuffer().then(buf=>{
   const wb=XLSX.read(buf,{type:'array',cellDates:true});
   const main=wb.SheetNames.find(n=>/претенз/i.test(n))||wb.SheetNames[0];
   IMP={fileName:file.name,wb,sheet:main,stage:'map',paySheet:wb.SheetNames.find(n=>/оплат/i.test(n))||null,enfSheet:wb.SheetNames.find(n=>/поступ/i.test(n))||null};
   loadImpSheet();renderContent();
  }).catch(err=>toast('Не удалось прочитать файл: '+err.message,true));return;
 }
 if(el.id==='restore-file'&&el.files[0]){
  el.files[0].text().then(t=>{const d=JSON.parse(t);if(!d.claims||!d.employees)throw new Error('неверный формат');if(!confirm('Заменить текущие данные данными из резервной копии?'))return;DB=migrate(d);writeDB();tx(()=>audit('settings',{field:'Данные',new:'восстановлено из резервной копии'}));render();toast('Данные восстановлены');}).catch(err=>toast('Ошибка восстановления: '+err.message,true));
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.bell){UI.bell=false;updateBell();}else if(PROFILE!==null||($('#modal-root').innerHTML&&!CARD))closeModal();}});
['mousemove','keydown','click'].forEach(ev=>document.addEventListener(ev,()=>{const s=getSession();if(s&&Date.now()-s.last>30000){s.last=Date.now();setSession(s);}},{passive:true}));
setInterval(()=>{const s=getSession();if(!s||!ME)return;const now=Date.now();if(now-s.last>30*60000||now-s.loginAt>8*3600000){tx(()=>audit('logout',{note:'Сессия завершена по таймауту'}));setSession(null);ME=null;closeModal();render();toast('Сессия завершена по таймауту. Войдите снова.',true);}},60000);
setInterval(()=>{if(ME){if(runNotifications())updateBell();}},10*60000);
window.addEventListener('storage',e=>{if(e.key===LS){DB=readDB()||DB;if(!CARD&&ME){if(UI.tab==='settings'||UI.tab==='import')return;renderContent();}updateBell();}});
function openFromHash(){const m=/#claim=([\w-]+)/.exec(location.hash);if(m&&ME)openClaim(m[1]);}

/* =================== Запуск =================== */
DB=readDB();
if(!DB){DB=seed();writeDB();}
runNotifications();
render();
openFromHash();
</script>
